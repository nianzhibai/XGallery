services:
  xgallery:
    image: ghcr.io/nianzhibai/xgallery:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      ALBUMS_DIR: /albums
      DATABASE_PATH: /app/data/xgallery.db
      ALBUMS_SYNC_ENABLED: "false"
      ALBUMS_SYNC_TIMEZONE: Asia/Shanghai
      ALBUMS_SYNC_TIME: "02:00"
      ORIGINAL_CACHE_TTL: "604800"
      PREVIEW_CACHE_TTL: "604800"
    volumes:
      - ./albums:/albums:ro
      - xgallery-data:/app/data

volumes:
  xgallery-data:
